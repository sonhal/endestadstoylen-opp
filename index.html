<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endestadstøylen opp</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: Georgia, 'Times New Roman', serif;
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem 4.5rem;
      overflow: hidden;
      background-color: #1a2a3a;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1531366936337-7c912a4589a7?auto=format&fit=crop&w=1920&q=85');
      background-size: cover;
      background-position: center 40%;
      background-repeat: no-repeat;
      filter: brightness(0.55) saturate(0.9);
      z-index: 0;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10, 20, 35, 0.35) 0%,
        rgba(10, 20, 35, 0.60) 100%
      );
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 820px;
    }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #a8cce8;
      border: 1px solid rgba(168, 204, 232, 0.45);
      border-radius: 2px;
      padding: 0.35em 0.9em;
      margin-bottom: 1.6rem;
    }

    /* ── Title ── */
    h1 {
      font-size: clamp(2.4rem, 7vw, 5.5rem);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 24px rgba(0,0,0,0.55);
      margin-bottom: 1rem;
    }

    /* ── Subtitle ── */
    .subtitle {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      color: rgba(220, 235, 255, 0.92);
      letter-spacing: 0.03em;
      margin-bottom: 3.5rem;
    }

    /* ── Divider ── */
    .divider {
      width: 60px;
      height: 2px;
      background: rgba(168, 204, 232, 0.6);
      margin: 0 auto 3rem;
    }

    /* ── Countdown ── */
    .countdown {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 1.5rem;
    }

    .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
    }

    .countdown-number {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 300;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 20px rgba(0,0,0,0.4);
      min-width: 2.2ch;
      text-align: center;
    }

    .countdown-label {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(168, 204, 232, 0.85);
      margin-top: 0.45rem;
    }

    .countdown-sep {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 200;
      color: rgba(255,255,255,0.3);
      line-height: 1;
      align-self: flex-start;
      padding-top: 0;
      margin-top: 0;
    }

    /* ── Finished state ── */
    .countdown-done {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      color: #a8cce8;
      letter-spacing: 0.05em;
    }

    /* ── Results link ── */
    .hero-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      margin-top: 3rem;
    }

    .results-link {
      display: inline-block;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
      text-decoration: none;
      border: 1px solid rgba(168, 204, 232, 0.6);
      border-radius: 2px;
      padding: 0.8em 1.6em;
      background: rgba(10, 20, 35, 0.35);
      transition: background 0.15s, border-color 0.15s;
    }

    .results-link:hover,
    .results-link:focus-visible {
      background: rgba(168, 204, 232, 0.2);
      border-color: #a8cce8;
    }

    /* ── Last race highlight ── */
    .last-race {
      display: block;
      width: 100%;
      max-width: 440px;
      margin: 2.6rem auto 0;
      text-align: left;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
      text-decoration: none;
      background: rgba(10, 20, 35, 0.55);
      border: 1px solid rgba(168, 204, 232, 0.35);
      border-radius: 10px;
      padding: 1.1rem 1.25rem 1rem;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: border-color 0.15s, transform 0.15s, background 0.15s;
    }

    .last-race[hidden] { display: none; }

    .last-race:hover,
    .last-race:focus-visible {
      border-color: #a8cce8;
      background: rgba(10, 20, 35, 0.7);
      transform: translateY(-2px);
    }

    .last-race-eyebrow {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #a8cce8;
    }

    .last-race-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0.2rem 0 0.8rem;
    }

    .last-race ol { list-style: none; }

    .last-race li {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.3rem 0;
      font-size: 0.95rem;
    }

    .last-race li + li { border-top: 1px solid rgba(168, 204, 232, 0.15); }

    .last-race .medal {
      flex: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      align-self: center;
    }

    .last-race .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .last-race .t { font-variant-numeric: tabular-nums; }
    .last-race .gap { font-size: 0.8rem; color: rgba(200, 220, 240, 0.6); font-variant-numeric: tabular-nums; min-width: 3.6rem; text-align: right; }

    .last-race-foot {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.4rem 1rem;
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: rgba(200, 220, 240, 0.75);
    }

    .last-race-cta { font-weight: 700; color: #ffffff; letter-spacing: 0.04em; }
    .last-race:hover .last-race-cta { text-decoration: underline; }

    /* ── Latest news ── */
    .latest-news {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      width: 100%;
      max-width: 440px;
      margin: 0.8rem auto 0;
      text-align: left;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.9rem;
      color: #ffffff;
      text-decoration: none;
      background: rgba(10, 20, 35, 0.55);
      border: 1px solid rgba(168, 204, 232, 0.35);
      border-radius: 10px;
      padding: 0.75rem 1.25rem;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: border-color 0.15s, transform 0.15s, background 0.15s;
    }

    .latest-news[hidden] { display: none; }

    .latest-news:hover,
    .latest-news:focus-visible {
      border-color: #a8cce8;
      background: rgba(10, 20, 35, 0.7);
      transform: translateY(-2px);
    }

    .latest-news-eyebrow {
      flex: none;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #a8cce8;
    }

    .latest-news-title { flex: 1; min-width: 0; }
    .latest-news:hover .latest-news-title { text-decoration: underline; }

    /* ── Footer note ── */
    .hero-footer {
      position: absolute;
      bottom: 1.4rem;
      left: 0;
      right: 0;
      z-index: 2;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.72rem;
      color: rgba(200, 220, 240, 0.45);
      letter-spacing: 0.05em;
      text-align: center;
    }

    /* ── Responsive tweaks ── */
    @media (max-width: 480px) {
      .countdown-sep { display: none; }
      .countdown-unit { min-width: 70px; }
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-bg" role="img" aria-label="Norsk fjelllandskap"></div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <span class="badge">Fjellløp</span>

    <h1>Endestadstøylen opp</h1>

    <p class="subtitle">Neste løp kl&nbsp;12.00 &mdash; 26.&thinsp;Mars&nbsp;2027</p>

    <div class="divider" aria-hidden="true"></div>

    <div class="countdown" id="countdown" aria-live="polite" aria-label="Nedtelling til løpet"></div>

    <nav class="hero-links" aria-label="Mer om løpet">
      <a class="results-link" href="loypa.html">Løypa &rarr;</a>
      <a class="results-link" href="resultater.html">Tidligere resultater &rarr;</a>
      <a class="results-link" href="nyheter.html">Nyheter &rarr;</a>
    </nav>

    <!-- Fylles ut fra results/ av scriptet nederst; forblir skjult om resultatene ikke kan lastes -->
    <a class="last-race" id="last-race" href="resultater.html" hidden></a>

    <!-- Siste sak fra nyheter/nyheter.csv; forblir skjult om fila ikke kan lastes -->
    <a class="latest-news" id="latest-news" href="nyheter.html" hidden></a>
  </div>

  <p class="hero-footer">Endestadstøylen opp &bull; Fjellløp</p>
</section>

<script>
  // Target: 2027-03-26 12:00:00 Europe/Oslo (CET = UTC+1; DST starts March 28 in 2027)
  var TARGET_UTC = new Date('2027-03-26T11:00:00Z').getTime();

  var el = document.getElementById('countdown');

  function pad(n) {
    return String(Math.floor(n)).padStart(2, '0');
  }

  function buildUnits(days, hours, minutes, seconds) {
    var units = [
      { value: pad(days),    label: days === 1 ? 'Dag' : 'Dager' },
      { value: pad(hours),   label: 'Timer' },
      { value: pad(minutes), label: 'Minutter' },
      { value: pad(seconds), label: 'Sekunder' }
    ];

    var html = '';
    units.forEach(function(u, i) {
      html += '<div class="countdown-unit">'
            + '<span class="countdown-number">' + u.value + '</span>'
            + '<span class="countdown-label">' + u.label + '</span>'
            + '</div>';
      if (i < units.length - 1) {
        html += '<span class="countdown-sep" aria-hidden="true">:</span>';
      }
    });
    return html;
  }

  function tick() {
    var now  = Date.now();
    var diff = TARGET_UTC - now;

    if (diff <= 0) {
      el.innerHTML = '<p class="countdown-done">Løpet er i gang!</p>';
      return;
    }

    var totalSec = Math.floor(diff / 1000);
    var seconds  = totalSec % 60;
    var totalMin = Math.floor(totalSec / 60);
    var minutes  = totalMin % 60;
    var totalHr  = Math.floor(totalMin / 60);
    var hours    = totalHr % 24;
    var days     = Math.floor(totalHr / 24);

    el.innerHTML = buildUnits(days, hours, minutes, seconds);

    // Schedule next tick aligned to the next whole second
    var msIntoSec = diff % 1000;
    setTimeout(tick, msIntoSec > 0 ? msIntoSec : 1000);
  }

  tick();
</script>

<script src="assets/results.js"></script>
<script>
  // Oppsummering av siste løp
  (function () {
    var card = document.getElementById('last-race');
    var R = window.Results;
    if (!R || !window.fetch) return;
    var MEDALS = ['#d4a53a', '#b3bcc6', '#c07a4a'];

    R.loadRaceIndex().then(function (races) {
      if (!races.length) return;
      var race = races[0];
      return R.loadRace(race).then(function (data) {
        if (!data.finishers.length) return;
        var s = data.stats, d = data.decimals, esc = R.esc;

        var rows = data.finishers.filter(function (f) { return f.place <= 3; }).map(function (f) {
          return '<li><span class="medal" style="background:' + MEDALS[f.place - 1] + '" aria-label="' + f.place + '. plass"></span>' +
            '<span class="who">' + esc(f.name) + '</span>' +
            '<span class="t">' + R.formatTime(f.seconds, d) + '</span>' +
            '<span class="gap">' + (f.gap ? R.formatGap(f.gap, d) : '') + '</span></li>';
        }).join('');

        var facts = [s.finishers + ' i mål'];
        if (race.climbM) facts.push('vinnerfart ' + R.formatVertical(s.fastest, race.climbM));
        if (race.note) facts.push(race.note.replace(/\s*[–-].*$/, ''));

        card.href = 'lop.html?ar=' + encodeURIComponent(race.year);
        card.innerHTML =
          '<div class="last-race-eyebrow">Siste løp' + (race.date ? ' · ' + esc(R.formatDate(race.date)) : '') + '</div>' +
          '<div class="last-race-title">' + esc(race.year) + ': ' + esc(s.winner.name) + ' vant</div>' +
          '<ol>' + rows + '</ol>' +
          '<div class="last-race-foot"><span>' + esc(facts.join(' · ')) + '</span>' +
          '<span class="last-race-cta">Se resultatene &rarr;</span></div>';
        card.setAttribute('aria-label', 'Siste løp ' + race.year + ': ' + s.winner.name + ' vant på ' +
          R.formatTime(s.fastest, d) + '. Se resultatene.');
        card.hidden = false;
      });
    }).catch(function () { /* ingen resultater å vise – kortet forblir skjult */ });
  })();
</script>
<script>
  // Siste nytt
  (function () {
    var card = document.getElementById('latest-news');
    var R = window.Results;
    if (!R || !window.fetch) return;

    R.loadNews().then(function (items) {
      if (!items.length) return;
      var n = items[0];
      card.innerHTML =
        '<span class="latest-news-eyebrow">' + (n.type === 'presse' ? 'I media' : 'Siste nytt') + '</span>' +
        '<span class="latest-news-title">' + R.esc(n.title) + (n.source ? ' (' + R.esc(n.source) + ')' : '') + ' &rarr;</span>';
      card.hidden = false;
    }).catch(function () { /* ingen nyheter å vise – kortet forblir skjult */ });
  })();
</script>

</body>
</html>
